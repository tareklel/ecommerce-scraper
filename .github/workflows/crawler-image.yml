name: Crawler image

# Tests, then builds the crawler image, pushes it to ECR as `sha-<7 chars>`,
# and deploys it by moving `latest` (what ECS runs) to it. Auto-deploy was
# chosen 2026-10-15 for a solo workflow: tests gate every deploy, and the
# summary names the previously live image so a rollback is one run of
# "Promote crawler image" with that tag. Plan: tickets/cicd_pipeline.md.

on:
  push:
    branches: [main]
    # Only code that ends up in the image; docs-only commits don't build.
    paths:
      - "ecommercecrawl/**"
      - "run_*.py"
      - "scripts/**"
      - "Dockerfile"
      # The tracked file is lowercase `dockerfile`; path filters are case-sensitive.
      - "dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/crawler-image.yml"
  workflow_dispatch:

# One build at a time per branch; a newer push waits rather than racing.
concurrency:
  group: crawler-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: ecommerce-scraper
  # Same Poetry version the Dockerfile installs.
  POETRY_VERSION: "1.8.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same Python as the image (python:3.11-slim).
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry==${POETRY_VERSION}"

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      # `python -m pytest` puts the repo root on sys.path, as when run
      # locally; the repo has no pytest config telling it where to look.
      - name: Run tests
        run: poetry run python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    # The AWS role only trusts main (public repo: never PRs or other branches).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # lets the job get a GitHub OIDC token to assume the AWS role
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CRAWLER_IMAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Remember what is live before this deploy, for the rollback hint.
      - name: Record currently live image
        id: previous
        run: |
          prev=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].[imageDigest, join(`,`, imageTags)]' \
            --output text 2>/dev/null || true)
          echo "digest=$(cut -f1 <<<"$prev")" >> "$GITHUB_OUTPUT"
          echo "tags=$(cut -f2 <<<"$prev")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Pushing both tags in one go: `sha-…` keeps the build addressable for
      # rollback (ECR keeps the last 20), `latest` is the deploy.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # A plain single-platform image: no attestation manifests, so ECR
          # gets no untagged side-images and promotion can re-tag it directly.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          PREV_DIGEST: ${{ steps.previous.outputs.digest }}
          PREV_TAGS: ${{ steps.previous.outputs.tags }}
        run: |
          {
            echo "### Deployed \`${{ steps.tag.outputs.tag }}\` as \`latest\`"
            echo
            echo "The next ECS crawl / image-pipeline run uses this image."
            echo
            echo "- previously live: \`${PREV_TAGS:-unknown}\` (\`${PREV_DIGEST:-unknown}\`)"
            echo "- to roll back: run **Promote crawler image** with one of the previous \`sha-…\` / \`legacy-…\` tags above"
          } >> "$GITHUB_STEP_SUMMARY"
